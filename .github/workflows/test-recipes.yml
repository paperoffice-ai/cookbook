name: Test Recipes

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'getting-started/**'
      - 'document-ai/**'
      - 'agent-media-ai/**'
      - 'security-ai/**'
      - 'knowledge-ai/**'
      - 'analysis-ai/**'

env:
  PAPEROFFICE_API_KEY: ${{ secrets.PAPEROFFICE_API_KEY }}

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: |
          find . -name "*.py" -not -path "./.git/*" -exec python3 -m py_compile {} \;
          echo "All Python files OK"

      - name: Node.js syntax check
        run: |
          find . -name "*.js" -not -path "./.git/*" -not -path "*/node_modules/*" -exec node --check {} \;
          echo "All Node.js files OK"

      - name: Shell syntax check
        run: |
          find . -name "*.sh" -not -path "./.git/*" -exec bash -n {} \;
          echo "All shell files OK"

  api-smoke-test:
    name: API Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: API health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.paperoffice.ai/latest/health)
          if [ "$STATUS" -eq 200 ]; then
            echo "API reachable (HTTP $STATUS)"
          else
            echo "API unreachable (HTTP $STATUS)"
            exit 1
          fi

      - name: Translation endpoint smoke test
        if: env.PAPEROFFICE_API_KEY != ''
        run: |
          echo "Testing Translation endpoint..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $PAPEROFFICE_API_KEY" \
            -X POST "https://api.paperoffice.ai/latest/translate/text" \
            -d "text=Hello&target_language=de&source_language=en")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          if echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='success'" 2>/dev/null; then
            echo "Translation endpoint OK"
          elif [ "$HTTP_CODE" -lt 500 ]; then
            echo "Translation endpoint reachable (non-5xx)"
          else
            echo "Translation endpoint server error"
            exit 1
          fi

      - name: Fake Email endpoint smoke test
        if: env.PAPEROFFICE_API_KEY != ''
        run: |
          echo "Testing Fake Email endpoint..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $PAPEROFFICE_API_KEY" \
            -X POST "https://api.paperoffice.ai/latest/fakeemail/check" \
            -d "email=test@mailinator.com")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Fake Email endpoint OK"
          else
            echo "Fake Email endpoint returned $HTTP_CODE"
            exit 1
          fi
